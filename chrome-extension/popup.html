<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOXA Companion</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="popup-card">
    <div class="header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">VOXA</span>
          <span class="brand-sub">Adaptive Voice AI</span>
        </div>
      </div>
      <div class="status-indicator" id="statusIndicator">
        <span class="status-dot" id="statusDot">○</span>
        <span class="status-label" id="statusLabel">Not Connected</span>
      </div>
    </div>

    <div class="status-card">
      <div class="status-row">
        <span class="status-title">Current status:</span>
        <span class="status-val" id="currentStatusText">Idle</span>
      </div>
      <div class="status-subrow" id="activeRequestRow" hidden>
        <span class="sub-label">Request ID:</span>
        <span class="sub-val" id="activeRequestId">—</span>
      </div>
      <div class="server-input-group">
        <input type="text" class="server-input" id="inputBackendUrl" placeholder="http://localhost:3000" spellcheck="false" />
        <button class="btn-save" id="btnSaveUrl" title="Save and reconnect">Save</button>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <span>Quick Launch Services</span>
      </div>
      <div class="action-grid">
        <button class="action-btn" id="btnOpenGmail" title="Open Gmail">
          <span class="action-icon">✉️</span>
          <span class="action-name">Gmail</span>
        </button>
        <button class="action-btn" id="btnOpenCalendar" title="Open Google Calendar">
          <span class="action-icon">📅</span>
          <span class="action-name">Calendar</span>
        </button>
        <button class="action-btn" id="btnOpenClassroom" title="Open Google Classroom">
          <span class="action-icon">🎓</span>
          <span class="action-name">Classroom</span>
        </button>
      </div>
    </div>

    <div class="section" id="lastActionSection" hidden>
      <div class="section-header">
        <span>Last Voice Action</span>
      </div>
      <div class="last-action-card" id="lastActionContent">
        <div class="last-action-type" id="lastActionType">—</div>
        <div class="last-action-detail" id="lastActionDetail">—</div>
      </div>
    </div>

    <div class="footer">
      <div class="footer-tagline">Speak. Interrupt. Adapt.</div>
      <button class="btn-refresh" id="btnReconnect" title="Reconnect to VOXA">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
        <span>Reconnect</span>
      </button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
